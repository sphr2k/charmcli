  <line x1="24" y1="204" x2="680" y2="204" stroke="#8B949E" stroke-width="1"/>
  <text x="24" y="226" class="t muted">uptime</text>
  <text x="120" y="226" class="t plain">10d19h</text>
  <text x="320" y="226" class="t muted">disk</text>
  <text x="416" y="226" class="t plain">68% · 25G</text>
  <text x="24" y="248" class="t muted">load</text>
  <text x="120" y="248" class="t plain">0.33 0.62 0.92</text>
  <text x="320" y="248" class="t muted">reboot</text>
  <text x="416" y="248" class="t warning">⚠ required</text>
  <text x="24" y="270" class="t muted">cloud-init</text>
