  <!-- Kubernetes -->
  <text x="24" y="310" class="t accent">Kubernetes</text>
  <line x1="24" y1="322" x2="680" y2="322" stroke="#8B949E" stroke-width="1"/>
  <text x="24" y="344" class="t muted">kubelet</text>
  <text x="120" y="344" class="t plain">v1.34.3</text>
  <text x="320" y="344" class="t muted">cpu</text>
  <text x="416" y="344" class="t plain">4</text>
  <text x="24" y="366" class="t muted">os</text>
  <text x="120" y="366" class="t plain">Ubuntu 24.04.4</text>
  <text x="320" y="366" class="t muted">memory</text>
  <text x="416" y="366" class="t plain">11.7 GiB</text>
  <text x="24" y="388" class="t muted">kernel</text>
  <text x="120" y="388" class="t plain">7.0.0-28</text>
  <text x="320" y="388" class="t muted">runtime</text>
  <text x="416" y="388" class="t plain">containerd 2.3.2</text>
</svg>
