<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460">
  <rect width="720" height="460" fill="#0d1117"/>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; }
    .title { fill: #E6EDF3; font-weight: 700; }
    .accent { fill: #79C0FF; }
    .success { fill: #3FB950; }
    .warning { fill: #D29922; font-weight: 700; }
    .muted { fill: #8B949E; }
    .plain { fill: #E6EDF3; }
    .purple { fill: #A371F7; }
  </style>
  <!-- Header -->
  <text x="24" y="36" class="t purple">▌</text>
  <text x="40" y="36" class="t title">homelab-node-1</text>
  <text x="580" y="36" class="t success">● READY</text>
  <text x="40" y="56" class="t muted">esxi · pet · 192.168.200.1 · 10d12h</text>

  <!-- Server -->
  <text x="24" y="96" class="t accent">Server</text>
  <line x1="24" y1="108" x2="680" y2="108" stroke="#8B949E" stroke-width="1"/>
  <text x="24" y="130" class="t muted">power</text>
  <text x="120" y="130" class="t plain">poweredOn</text>
  <text x="320" y="130" class="t muted">ssh</text>
  <text x="416" y="130" class="t success">✓ reachable</text>
  <text x="24" y="152" class="t muted">ipv4</text>
  <text x="120" y="152" class="t plain">10.0.7.20</text>

